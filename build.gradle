plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.91'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup('cc.tweaked') }
    }
}

base {
    archivesName = 'cc-tweaked-unicode-support'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.getByName(mod_id)
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    cobaltPatch
}

configurations {
    cobaltOriginal {
        canBeConsumed = false
        transitive = false
    }
    cobaltPatchCompileOnly.extendsFrom cobaltOriginal
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}"
    compileOnly "cc.tweaked:cobalt:0.9.9"
    localRuntime "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "cc.tweaked:cobalt:0.9.9"
    testImplementation "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}"
    testImplementation sourceSets.cobaltPatch.output
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    cobaltOriginal "cc.tweaked:cobalt:0.9.9"
    cobaltPatchImplementation "org.ow2.asm:asm:9.7"
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

def patchedCobaltJar = layout.buildDirectory.file('generated/cobalt/cobalt-0.9.10.jar')
def patchCobalt = tasks.register('patchCobalt', JavaExec) {
    dependsOn tasks.named('cobaltPatchClasses')
    classpath = sourceSets.cobaltPatch.runtimeClasspath + configurations.cobaltOriginal
    mainClass = 'ru.sanseddy.cctweakedunicodesupport.build.PatchCobalt'

    inputs.files(configurations.cobaltOriginal)
    inputs.files(sourceSets.cobaltPatch.output)
    outputs.file(patchedCobaltJar)

    doFirst {
        args configurations.cobaltOriginal.singleFile, patchedCobaltJar.get().asFile
    }
}

def verifyPatchedCobalt = tasks.register('verifyPatchedCobalt', JavaExec) {
    dependsOn patchCobalt
    classpath = sourceSets.cobaltPatch.runtimeClasspath + files(patchedCobaltJar)
    mainClass = 'ru.sanseddy.cctweakedunicodesupport.build.VerifyCobalt'
}

def stagePatchedCobalt = tasks.register('stagePatchedCobalt', Sync) {
    dependsOn patchCobalt
    from patchedCobaltJar
    into layout.buildDirectory.dir('generated/cobaltResources/META-INF/jarjar')
}

sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/cobaltResources')
tasks.named('processResources').configure {
    dependsOn stagePatchedCobalt
}

tasks.named('check').configure {
    dependsOn verifyPatchedCobalt
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            cc_tweaked_version_range: cc_tweaked_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    from('LICENSES') {
        into 'META-INF/LICENSES'
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
